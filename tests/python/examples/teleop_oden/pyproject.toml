#
# teleop_oden tests. The ROS-dependent ones skip without rclpy; the example's
# container (examples/teleop_oden/Dockerfile) runs them all.

[project]
name = "teleop-oden-tests"
version = "0.0.0"
requires-python = ">=3.11,<3.14"

[project.optional-dependencies]
dev = ["pytest", "pyyaml", "msgpack", "pyzmq"]
