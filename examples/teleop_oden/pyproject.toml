[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "isaaccapture-examples-teleop-oden"
version = "0.1.0"
description = "ROS 2 topics and ZMQ streams carried between workstation and robot by Voysys Oden"
requires-python = ">=3.10,<3.14"
# rclpy and the message packages come from the ROS 2 installation.
dependencies = [
    "msgpack",
    "pyyaml",
]

[project.optional-dependencies]
zmq = ["pyzmq"]

[tool.hatch.build.targets.wheel]
only-include = ["python/isaaccapture_examples/teleop_oden"]
sources = ["python"]
