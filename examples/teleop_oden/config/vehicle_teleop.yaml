# The vehicle_teleop example's ZMQ commands (examples/vehicle_teleop), carried to
# the vehicle by Oden. On the workstation the steering or keyboard worker binds
# tcp://*:5555 as usual; on the vehicle run the Panda worker with
# --connect tcp://127.0.0.1:5555, where the robot bridge publishes.
zmq:
  - name: vehicle_control
    direction: to_robot
    topic: vehicle_control
    source: tcp://127.0.0.1:5555
    sink: tcp://127.0.0.1:5555
    payload: json
    precision: 0.0001
