# The teleop_ros2 reference publisher's topics (examples/teleop_ros2), carried to
# the robot by Oden, and the robot's joint states carried back. Any topic of any
# type can be listed, or matched with a glob such as "/xr_teleop/*"; "type" may
# be left out when the topic is on the ROS graph. Order is priority: when a
# control message is full, later topics wait for the next one.
#
# precision: floats cross as whole multiples of it. 0.0001 is a tenth of a
# millimetre for positions in metres and about 0.01 degrees for quaternions.
to_robot:
  - topic: /xr_teleop/ee_poses
    type: teleop_ros2_interfaces/msg/NamedPoseArray
    precision: 0.0001
  - topic: /xr_teleop/root_twist
    type: geometry_msgs/msg/TwistStamped
    precision: 0.0001
  - topic: /xr_teleop/root_pose
    type: geometry_msgs/msg/PoseStamped
    precision: 0.0001
  - topic: /xr_teleop/finger_joints
    type: sensor_msgs/msg/JointState
    precision: 0.0001
  - topic: /xr_teleop/head_pose
    type: geometry_msgs/msg/PoseStamped
    precision: 0.0001
  - topic: /xr_teleop/controller_data
    type: std_msgs/msg/ByteMultiArray
    payload: msgpack
    precision: 0.0001
  - topic: /xr_teleop/full_body
    type: std_msgs/msg/ByteMultiArray
    payload: msgpack
    precision: 0.0001
  # Left out by default: the raw hand-tracking skeleton (25 joint poses per hand,
  # for retargeting on the robot; the robot usually takes ee_poses and
  # finger_joints instead), and /tf, which repeats the wrist and head poses above.
  # - topic: /xr_teleop/hand
  #   type: teleop_ros2_interfaces/msg/NamedPoseArray
  #   precision: 0.0001
  # - topic: /tf
  #   type: tf2_msgs/msg/TFMessage
  #   precision: 0.0001

to_operator:
  - topic: /joint_states
    type: sensor_msgs/msg/JointState
